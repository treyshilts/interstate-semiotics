<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student</title>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #111;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* Hidden 256x224 game canvas */
    #game {
      display: none;
    }

    /* Visible CRT output */
    #crt {
      width: 768px;
      height: 672px;
      display: block;
    }
  </style>
</head>

<body>

<canvas id="game" width="256" height="224"></canvas>
<canvas id="crt" width="768" height="672"></canvas>

<script type="module">

import { CRTShader } from "./CRTShader.js";


// ============================================================
// GAME CANVAS
// ============================================================

const gameCanvas = document.getElementById("game");
const ctx = gameCanvas.getContext("2d");

ctx.imageSmoothingEnabled = false;


// ============================================================
// GAME SETTINGS
// ============================================================

const GAME_WIDTH = 256;
const GAME_HEIGHT = 224;

const MOVE_SPEED = 35;

const BACKGROUND_COLOR = "#3a9b46";

const WALK_FPS = 5;
const WALK_FRAME_TIME = 1000 / WALK_FPS;


// ============================================================
// CHARACTER
// ============================================================

let x = 120;
let y = 100;

let lastDirection = "D";
let moving = false;

let walkFrame = 0;
let walkTimer = 0;

const directions = [
  "U",
  "UR",
  "R",
  "DR",
  "D",
  "DL",
  "L",
  "UL"
];


// ============================================================
// WALKING FRAMES
// ============================================================

const walkImages = {};

for (const direction of directions) {

  walkImages[direction] = [];

  for (let frame = 0; frame < 4; frame++) {

    const img = new Image();

    img.src =
      `../guy_walk_${direction}_${frame}.png`;

    walkImages[direction].push(img);
  }
}


// ============================================================
// STANDING IMAGES
// ============================================================

const standImages = {};

for (const direction of directions) {

  const img = new Image();

  img.src =
    `../guy_stand_${direction}.gif`;

  standImages[direction] = img;
}


// ============================================================
// KEYBOARD
// ============================================================

const keys = {};

window.addEventListener("keydown", event => {

  const key = event.key.toLowerCase();

  if (
    key === "arrowup" ||
    key === "arrowdown" ||
    key === "arrowleft" ||
    key === "arrowright"
  ) {
    event.preventDefault();
  }

  keys[key] = true;
});


window.addEventListener("keyup", event => {

  keys[event.key.toLowerCase()] = false;

});


window.addEventListener("blur", () => {

  for (const key in keys) {
    keys[key] = false;
  }

});


// ============================================================
// UPDATE GAME
// ============================================================

function update(deltaTime, deltaMilliseconds) {

  let dx = 0;
  let dy = 0;


  if (keys["arrowup"] || keys["w"]) {
    dy -= 1;
  }

  if (keys["arrowdown"] || keys["s"]) {
    dy += 1;
  }

  if (keys["arrowleft"] || keys["a"]) {
    dx -= 1;
  }

  if (keys["arrowright"] || keys["d"]) {
    dx += 1;
  }


  const wasMoving = moving;

  moving =
    dx !== 0 ||
    dy !== 0;


  // ----------------------------------------------------------
  // MOVEMENT
  // ----------------------------------------------------------

  if (moving) {

    const length =
      Math.sqrt(
        dx * dx +
        dy * dy
      );

    dx /= length;
    dy /= length;


    x +=
      dx *
      MOVE_SPEED *
      deltaTime;

    y +=
      dy *
      MOVE_SPEED *
      deltaTime;


    // Determine direction

    let direction = "";

    if (dy < 0) direction += "U";
    if (dy > 0) direction += "D";
    if (dx < 0) direction += "L";
    if (dx > 0) direction += "R";


    // Reset animation when direction changes

    if (direction !== lastDirection) {

      walkFrame = 0;
      walkTimer = 0;

    }


    lastDirection = direction;


    // Reset animation when beginning to walk

    if (!wasMoving) {

      walkFrame = 0;
      walkTimer = 0;

    }


    // --------------------------------------------------------
    // 5 FPS WALK ANIMATION
    // --------------------------------------------------------

    walkTimer += deltaMilliseconds;

    while (walkTimer >= WALK_FRAME_TIME) {

      walkTimer -= WALK_FRAME_TIME;

      walkFrame =
        (walkFrame + 1) % 4;

    }

  } else {

    walkFrame = 0;
    walkTimer = 0;

  }


  // ----------------------------------------------------------
  // SCREEN BOUNDARIES
  // ----------------------------------------------------------

  const image =
    moving
      ? walkImages[lastDirection][walkFrame]
      : standImages[lastDirection];


  if (
    image &&
    image.complete &&
    image.naturalWidth > 0
  ) {

    x = Math.max(
      0,
      Math.min(
        GAME_WIDTH - image.naturalWidth,
        x
      )
    );


    y = Math.max(
      0,
      Math.min(
        GAME_HEIGHT - image.naturalHeight,
        y
      )
    );

  }

}


// ============================================================
// DRAW GAME
// ============================================================

function drawGame() {

  // Green background

  ctx.fillStyle = BACKGROUND_COLOR;

  ctx.fillRect(
    0,
    0,
    GAME_WIDTH,
    GAME_HEIGHT
  );


  // Character

  const image =
    moving
      ? walkImages[lastDirection][walkFrame]
      : standImages[lastDirection];


  if (
    image &&
    image.complete &&
    image.naturalWidth > 0
  ) {

    ctx.drawImage(
      image,
      Math.round(x),
      Math.round(y)
    );

  }

}


// ============================================================
// SERENITY SETTINGS
// ============================================================
//
// These are YOUR settings from the demo.
//

const CRT_SETTINGS = {

  enabled: true,

  smoothing: true,

  scanlineIntensity: 0.41,

  scanlineCount: 125,

  adaptiveIntensity: 0.13,

  brightness: 1.53,

  contrast: 1.80,

  saturation: 1.30,

  bloomIntensity: 1.50,

  bloomThreshold: 1.00,

  rgbShift: 1.00,

  vignetteStrength: 0.39,

  curvature: 0.145,

  flickerStrength: 0.013

};


// ============================================================
// WEBGL2
// ============================================================

const crtCanvas =
  document.getElementById("crt");

const gl =
  crtCanvas.getContext(
    "webgl2",
    {
      alpha: false
    }
  );


if (!gl) {

  throw new Error(
    "WebGL2 is not supported by this browser."
  );

}


// ============================================================
// BUILD SERENITY VERTEX SHADER
// ============================================================

function buildVertexSource() {

  return `#version 300 es

  precision highp float;

  const vec2 pos[4] = vec2[4](

    vec2(-1.0, -1.0),
    vec2( 1.0, -1.0),
    vec2(-1.0,  1.0),
    vec2( 1.0,  1.0)

  );


  const vec2 uvData[4] = vec2[4](

    vec2(0.0, 0.0),
    vec2(1.0, 0.0),
    vec2(0.0, 1.0),
    vec2(1.0, 1.0)

  );


  out vec2 vUv;


  void main() {

    vUv =
      uvData[gl_VertexID];

    gl_Position =
      vec4(
        pos[gl_VertexID],
        0.0,
        1.0
      );

  }

  `;

}


// ============================================================
// CONVERT SERENITY FRAGMENT SHADER FOR RAW WEBGL2
// ============================================================

function buildFragmentSource() {

  let body =
    CRTShader.fragmentShader;


  /*
    CRTShader.js is also compatible with Three.js.

    Serenity's own raw WebGL implementation converts that
    shader into WebGL2-compatible GLSL.

    We're doing the same conversion here.
  */


  // Remove original uniform declarations.

  body =
    body.replace(
      /uniform\s+[^;]+;\s*/g,
      ""
    );


  // Remove old varying declarations.

  body =
    body.replace(
      /varying\s+[^;]+;\s*/g,
      ""
    );


  // Rename texture.

  body =
    body.replace(
      /\btDiffuse\b/g,
      "uTexture"
    );


  // WebGL2 texture syntax.

  body =
    body.replace(
      /texture2D\s*\(/g,
      "texture("
    );


  // WebGL2 output variable.

  body =
    body.replace(
      /gl_FragColor/g,
      "fragColor"
    );


  // Rename Serenity's original main function.

  body =
    body.replace(
      /void main\s*\(/,
      "void mainImage("
    );


  return `#version 300 es

  precision highp float;

  uniform sampler2D uTexture;

  uniform bool uEnabled;

  uniform float scanlineIntensity;
  uniform float scanlineCount;

  uniform float time;
  uniform float yOffset;

  uniform float brightness;
  uniform float contrast;
  uniform float saturation;

  uniform float bloomIntensity;
  uniform float bloomThreshold;

  uniform float rgbShift;

  uniform float adaptiveIntensity;

  uniform float vignetteStrength;

  uniform float curvature;

  uniform float flickerStrength;


  in vec2 vUv;

  out vec4 fragColor;


  ${body}


  void main() {

    if (!uEnabled) {

      fragColor =
        texture(
          uTexture,
          vUv
        );

      return;

    }


    mainImage();

  }

  `;

}


// ============================================================
// COMPILE SHADER
// ============================================================

function compileShader(
  glContext,
  type,
  source
) {

  const shader =
    glContext.createShader(type);


  glContext.shaderSource(
    shader,
    source
  );


  glContext.compileShader(shader);


  if (
    !glContext.getShaderParameter(
      shader,
      glContext.COMPILE_STATUS
    )
  ) {

    const error =
      glContext.getShaderInfoLog(shader);


    console.error(source);

    throw new Error(
      error ||
      "Shader compile error"
    );

  }


  return shader;

}


// ============================================================
// CREATE WEBGL PROGRAM
// ============================================================

function createProgram(
  glContext,
  vertexSource,
  fragmentSource
) {

  const vertexShader =
    compileShader(
      glContext,
      glContext.VERTEX_SHADER,
      vertexSource
    );


  const fragmentShader =
    compileShader(
      glContext,
      glContext.FRAGMENT_SHADER,
      fragmentSource
    );


  const program =
    glContext.createProgram();


  glContext.attachShader(
    program,
    vertexShader
  );


  glContext.attachShader(
    program,
    fragmentShader
  );


  glContext.linkProgram(program);


  if (
    !glContext.getProgramParameter(
      program,
      glContext.LINK_STATUS
    )
  ) {

    throw new Error(
      glContext.getProgramInfoLog(program) ||
      "Program link error"
    );

  }


  return program;

}


// ============================================================
// CREATE SERENITY PROGRAM
// ============================================================

const program =
  createProgram(
    gl,
    buildVertexSource(),
    buildFragmentSource()
  );


const vao =
  gl.createVertexArray();


gl.bindVertexArray(vao);


// ============================================================
// UNIFORMS
// ============================================================

const uniformNames = [

  "uTexture",
  "uEnabled",

  "scanlineIntensity",
  "scanlineCount",

  "time",
  "yOffset",

  "brightness",
  "contrast",
  "saturation",

  "bloomIntensity",
  "bloomThreshold",

  "rgbShift",

  "adaptiveIntensity",

  "vignetteStrength",

  "curvature",

  "flickerStrength"

];


const uniforms = {};


for (const name of uniformNames) {

  uniforms[name] =
    gl.getUniformLocation(
      program,
      name
    );

}


// ============================================================
// GAME TEXTURE
// ============================================================

const texture =
  gl.createTexture();


gl.bindTexture(
  gl.TEXTURE_2D,
  texture
);


gl.texParameteri(
  gl.TEXTURE_2D,
  gl.TEXTURE_WRAP_S,
  gl.CLAMP_TO_EDGE
);


gl.texParameteri(
  gl.TEXTURE_2D,
  gl.TEXTURE_WRAP_T,
  gl.CLAMP_TO_EDGE
);


// ============================================================
// SMOOTHING
// ============================================================

const textureFilter =
  CRT_SETTINGS.smoothing
    ? gl.LINEAR
    : gl.NEAREST;


gl.texParameteri(
  gl.TEXTURE_2D,
  gl.TEXTURE_MIN_FILTER,
  textureFilter
);


gl.texParameteri(
  gl.TEXTURE_2D,
  gl.TEXTURE_MAG_FILTER,
  textureFilter
);


// Serenity flips the incoming canvas vertically.

gl.pixelStorei(
  gl.UNPACK_FLIP_Y_WEBGL,
  true
);


// Allocate texture memory.

gl.texImage2D(
  gl.TEXTURE_2D,
  0,
  gl.RGBA,
  GAME_WIDTH,
  GAME_HEIGHT,
  0,
  gl.RGBA,
  gl.UNSIGNED_BYTE,
  null
);


// ============================================================
// DRAW CRT
// ============================================================

function drawCRT(currentTime) {

  // Upload current game canvas.

  gl.bindTexture(
    gl.TEXTURE_2D,
    texture
  );


  gl.texSubImage2D(
    gl.TEXTURE_2D,
    0,
    0,
    0,
    gl.RGBA,
    gl.UNSIGNED_BYTE,
    gameCanvas
  );


  // Render across entire visible canvas.

  gl.viewport(
    0,
    0,
    gl.drawingBufferWidth,
    gl.drawingBufferHeight
  );


  gl.useProgram(program);

  gl.bindVertexArray(vao);


  gl.activeTexture(
    gl.TEXTURE0
  );


  gl.bindTexture(
    gl.TEXTURE_2D,
    texture
  );


  // ----------------------------------------------------------
  // SERENITY SETTINGS
  // ----------------------------------------------------------

  gl.uniform1i(
    uniforms.uTexture,
    0
  );


  gl.uniform1i(
    uniforms.uEnabled,
    CRT_SETTINGS.enabled ? 1 : 0
  );


  gl.uniform1f(
    uniforms.scanlineIntensity,
    CRT_SETTINGS.scanlineIntensity
  );


  gl.uniform1f(
    uniforms.scanlineCount,
    CRT_SETTINGS.scanlineCount
  );


  gl.uniform1f(
    uniforms.time,
    currentTime / 1000
  );


  gl.uniform1f(
    uniforms.yOffset,
    0.0
  );


  gl.uniform1f(
    uniforms.brightness,
    CRT_SETTINGS.brightness
  );


  gl.uniform1f(
    uniforms.contrast,
    CRT_SETTINGS.contrast
  );


  gl.uniform1f(
    uniforms.saturation,
    CRT_SETTINGS.saturation
  );


  gl.uniform1f(
    uniforms.bloomIntensity,
    CRT_SETTINGS.bloomIntensity
  );


  gl.uniform1f(
    uniforms.bloomThreshold,
    CRT_SETTINGS.bloomThreshold
  );


  gl.uniform1f(
    uniforms.rgbShift,
    CRT_SETTINGS.rgbShift
  );


  gl.uniform1f(
    uniforms.adaptiveIntensity,
    CRT_SETTINGS.adaptiveIntensity
  );


  gl.uniform1f(
    uniforms.vignetteStrength,
    CRT_SETTINGS.vignetteStrength
  );


  gl.uniform1f(
    uniforms.curvature,
    CRT_SETTINGS.curvature
  );


  gl.uniform1f(
    uniforms.flickerStrength,
    CRT_SETTINGS.flickerStrength
  );


  gl.drawArrays(
    gl.TRIANGLE_STRIP,
    0,
    4
  );

}


// ============================================================
// MAIN GAME LOOP
// ============================================================

let previousTime =
  performance.now();


function gameLoop(currentTime) {

  let deltaMilliseconds =
    currentTime -
    previousTime;


  previousTime =
    currentTime;


  // Prevent huge jumps after changing tabs.

  deltaMilliseconds =
    Math.min(
      deltaMilliseconds,
      50
    );


  const deltaTime =
    deltaMilliseconds /
    1000;


  // 1. Update game

  update(
    deltaTime,
    deltaMilliseconds
  );


  // 2. Draw raw 256×224 game

  drawGame();


  // 3. Feed that canvas through Serenity

  drawCRT(currentTime);


  requestAnimationFrame(
    gameLoop
  );

}


// ============================================================
// START
// ============================================================

requestAnimationFrame(
  gameLoop
);

</script>

</body>
</html>
