<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Student</title>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #111;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /*
      The actual game is 256 × 224.

      CSS enlarges it exactly 3×:
      256 × 3 = 768
      224 × 3 = 672
    */
    #game {
      width: 768px;
      height: 672px;

      image-rendering: pixelated;
      image-rendering: crisp-edges;

      display: block;
    }
  </style>
</head>

<body>

  <canvas
    id="game"
    width="256"
    height="224"
  ></canvas>


  <script>
    // ============================================================
    // CANVAS
    // ============================================================

    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    // Absolutely essential for pixel art.
    ctx.imageSmoothingEnabled = false;


    // ============================================================
    // GAME SETTINGS
    // ============================================================

    const GAME_WIDTH = 256;
    const GAME_HEIGHT = 224;

    // Character movement speed in game pixels per second.
    // Lower = slower.
    const MOVE_SPEED = 35;

    // Background color.
    const BACKGROUND_COLOR = "#3a9b46";


    // ============================================================
    // CHARACTER
    // ============================================================

    let x = 120;
    let y = 100;

    // Character begins facing downward.
    let lastDirection = "D";

    let moving = false;


    // ============================================================
    // IMAGE FILES
    // ============================================================

    /*
      index.html is inside /student/

      Your character GIFs are in the main/root directory.

      ../ means:
      "go up one directory"
    */

    const walkFiles = {
      U:  "../guy_walk_U.gif",
      UR: "../guy_walk_UR.gif",
      R:  "../guy_walk_R.gif",
      DR: "../guy_walk_DR.gif",
      D:  "../guy_walk_D.gif",
      DL: "../guy_walk_DL.gif",
      L:  "../guy_walk_L.gif",
      UL: "../guy_walk_UL.gif"
    };

    const standFiles = {
      U:  "../guy_stand_U.gif",
      UR: "../guy_stand_UR.gif",
      R:  "../guy_stand_R.gif",
      DR: "../guy_stand_DR.gif",
      D:  "../guy_stand_D.gif",
      DL: "../guy_stand_DL.gif",
      L:  "../guy_stand_L.gif",
      UL: "../guy_stand_UL.gif"
    };


    // ============================================================
    // LOAD IMAGES
    // ============================================================

    const walkImages = {};
    const standImages = {};

    function loadImages() {

      for (const direction in walkFiles) {
        const img = new Image();
        img.src = walkFiles[direction];

        walkImages[direction] = img;
      }

      for (const direction in standFiles) {
        const img = new Image();
        img.src = standFiles[direction];

        standImages[direction] = img;
      }
    }

    loadImages();


    // ============================================================
    // KEYBOARD INPUT
    // ============================================================

    const keys = {};

    window.addEventListener("keydown", (event) => {

      const key = event.key.toLowerCase();

      // Stop arrow keys from scrolling the webpage.
      if (
        key === "arrowup" ||
        key === "arrowdown" ||
        key === "arrowleft" ||
        key === "arrowright"
      ) {
        event.preventDefault();
      }

      keys[key] = true;
    });


    window.addEventListener("keyup", (event) => {

      const key = event.key.toLowerCase();

      keys[key] = false;
    });


    // If you click away from the browser, stop movement.
    window.addEventListener("blur", () => {

      for (const key in keys) {
        keys[key] = false;
      }

    });


    // ============================================================
    // UPDATE CHARACTER
    // ============================================================

    function update(deltaTime) {

      let dx = 0;
      let dy = 0;


      // UP
      if (
        keys["arrowup"] ||
        keys["w"]
      ) {
        dy -= 1;
      }


      // DOWN
      if (
        keys["arrowdown"] ||
        keys["s"]
      ) {
        dy += 1;
      }


      // LEFT
      if (
        keys["arrowleft"] ||
        keys["a"]
      ) {
        dx -= 1;
      }


      // RIGHT
      if (
        keys["arrowright"] ||
        keys["d"]
      ) {
        dx += 1;
      }


      moving = dx !== 0 || dy !== 0;


      // ==========================================================
      // MOVEMENT
      // ==========================================================

      if (moving) {

        /*
          Normalize movement.

          Without this, diagonal movement would be approximately
          1.414× faster than horizontal/vertical movement.
        */

        const length = Math.sqrt(
          dx * dx +
          dy * dy
        );

        dx /= length;
        dy /= length;


        x += dx * MOVE_SPEED * deltaTime;
        y += dy * MOVE_SPEED * deltaTime;


        // ========================================================
        // DETERMINE DIRECTION
        // ========================================================

        let direction = "";

        if (dy < 0) {
          direction += "U";
        }

        if (dy > 0) {
          direction += "D";
        }

        if (dx < 0) {
          direction += "L";
        }

        if (dx > 0) {
          direction += "R";
        }


        lastDirection = direction;
      }


      // ==========================================================
      // KEEP CHARACTER INSIDE GAME
      // ==========================================================

      /*
        Use whichever image we're currently displaying to
        determine the character dimensions.
      */

      const image = moving
        ? walkImages[lastDirection]
        : standImages[lastDirection];


      if (image && image.complete) {

        const width = image.naturalWidth;
        const height = image.naturalHeight;


        x = Math.max(
          0,
          Math.min(
            GAME_WIDTH - width,
            x
          )
        );


        y = Math.max(
          0,
          Math.min(
            GAME_HEIGHT - height,
            y
          )
        );

      }

    }


    // ============================================================
    // DRAW
    // ============================================================

    function draw() {

      // ----------------------------------------------------------
      // GREEN BACKGROUND
      // ----------------------------------------------------------

      ctx.fillStyle = BACKGROUND_COLOR;

      ctx.fillRect(
        0,
        0,
        GAME_WIDTH,
        GAME_HEIGHT
      );


      // ----------------------------------------------------------
      // SELECT CHARACTER IMAGE
      // ----------------------------------------------------------

      let image;

      if (moving) {

        image = walkImages[lastDirection];

      } else {

        image = standImages[lastDirection];

      }


      // ----------------------------------------------------------
      // DRAW CHARACTER
      // ----------------------------------------------------------

      if (
        image &&
        image.complete &&
        image.naturalWidth > 0
      ) {

        /*
          Math.round() ensures that the character always lands
          exactly on the game's pixel grid.
        */

        ctx.drawImage(
          image,
          Math.round(x),
          Math.round(y)
        );

      }

    }


    // ============================================================
    // GAME LOOP
    // ============================================================

    let previousTime = performance.now();


    function gameLoop(currentTime) {

      let deltaTime =
        (currentTime - previousTime) / 1000;

      previousTime = currentTime;


      /*
        Prevent a huge movement jump if the browser tab freezes,
        computer sleeps, DevTools pauses execution, etc.
      */

      deltaTime = Math.min(
        deltaTime,
        0.05
      );


      update(deltaTime);

      draw();


      requestAnimationFrame(gameLoop);
    }


    // ============================================================
    // START
    // ============================================================

    requestAnimationFrame(gameLoop);

  </script>

</body>
</html>
