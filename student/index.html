<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Student</title>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #111;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    #game {
      width: 768px;
      height: 672px;
      display: block;

      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
  </style>
</head>

<body>

<canvas
  id="game"
  width="256"
  height="224"
></canvas>

<script>

  // ============================================================
  // CANVAS
  // ============================================================

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");

  ctx.imageSmoothingEnabled = false;


  // ============================================================
  // GAME SETTINGS
  // ============================================================

  const GAME_WIDTH = 256;
  const GAME_HEIGHT = 224;

  const MOVE_SPEED = 35;

  const BACKGROUND_COLOR = "#3a9b46";

  // 5 FPS = one new frame every 200 milliseconds
  const WALK_FPS = 5;
  const WALK_FRAME_TIME = 1000 / WALK_FPS;


  // ============================================================
  // CHARACTER
  // ============================================================

  let x = 120;
  let y = 100;

  let lastDirection = "D";
  let moving = false;

  let walkFrame = 0;
  let walkTimer = 0;


  // ============================================================
  // DIRECTIONS
  // ============================================================

  const directions = [
    "U",
    "UR",
    "R",
    "DR",
    "D",
    "DL",
    "L",
    "UL"
  ];


  // ============================================================
  // LOAD WALKING FRAMES
  // ============================================================

  const walkImages = {};

  for (const direction of directions) {

    walkImages[direction] = [];

    for (let frame = 0; frame < 4; frame++) {

      const img = new Image();

      img.src =
        `../guy_walk_${direction}_${frame}.png`;

      walkImages[direction].push(img);

    }

  }


  // ============================================================
  // LOAD STANDING IMAGES
  // ============================================================

  const standImages = {};

  for (const direction of directions) {

    const img = new Image();

    img.src =
      `../guy_stand_${direction}.gif`;

    standImages[direction] = img;

  }


  // ============================================================
  // KEYBOARD
  // ============================================================

  const keys = {};

  window.addEventListener("keydown", (event) => {

    const key = event.key.toLowerCase();

    if (
      key === "arrowup" ||
      key === "arrowdown" ||
      key === "arrowleft" ||
      key === "arrowright"
    ) {
      event.preventDefault();
    }

    keys[key] = true;

  });


  window.addEventListener("keyup", (event) => {

    const key = event.key.toLowerCase();

    keys[key] = false;

  });


  window.addEventListener("blur", () => {

    for (const key in keys) {
      keys[key] = false;
    }

  });


  // ============================================================
  // UPDATE
  // ============================================================

  function update(deltaTime, deltaMilliseconds) {

    let dx = 0;
    let dy = 0;


    // UP
    if (
      keys["arrowup"] ||
      keys["w"]
    ) {
      dy -= 1;
    }


    // DOWN
    if (
      keys["arrowdown"] ||
      keys["s"]
    ) {
      dy += 1;
    }


    // LEFT
    if (
      keys["arrowleft"] ||
      keys["a"]
    ) {
      dx -= 1;
    }


    // RIGHT
    if (
      keys["arrowright"] ||
      keys["d"]
    ) {
      dx += 1;
    }


    const wasMoving = moving;

    moving =
      dx !== 0 ||
      dy !== 0;


    // ==========================================================
    // MOVING
    // ==========================================================

    if (moving) {

      const length =
        Math.sqrt(
          dx * dx +
          dy * dy
        );

      dx /= length;
      dy /= length;


      x +=
        dx *
        MOVE_SPEED *
        deltaTime;

      y +=
        dy *
        MOVE_SPEED *
        deltaTime;


      // Determine direction

      let direction = "";

      if (dy < 0) {
        direction += "U";
      }

      if (dy > 0) {
        direction += "D";
      }

      if (dx < 0) {
        direction += "L";
      }

      if (dx > 0) {
        direction += "R";
      }


      // If direction changed, begin its animation
      // from frame 0.

      if (direction !== lastDirection) {

        walkFrame = 0;
        walkTimer = 0;

      }


      lastDirection = direction;


      // If we just started walking, start on frame 0.

      if (!wasMoving) {

        walkFrame = 0;
        walkTimer = 0;

      }


      // ========================================================
      // WALK ANIMATION
      // ========================================================

      walkTimer += deltaMilliseconds;


      while (walkTimer >= WALK_FRAME_TIME) {

        walkTimer -= WALK_FRAME_TIME;

        walkFrame =
          (walkFrame + 1) % 4;

      }

    }


    // ==========================================================
    // STANDING
    // ==========================================================

    else {

      walkFrame = 0;
      walkTimer = 0;

    }


    // ==========================================================
    // KEEP CHARACTER ON SCREEN
    // ==========================================================

    const currentImage =
      moving
        ? walkImages[lastDirection][walkFrame]
        : standImages[lastDirection];


    if (
      currentImage &&
      currentImage.complete &&
      currentImage.naturalWidth > 0
    ) {

      const width =
        currentImage.naturalWidth;

      const height =
        currentImage.naturalHeight;


      x = Math.max(
        0,
        Math.min(
          GAME_WIDTH - width,
          x
        )
      );


      y = Math.max(
        0,
        Math.min(
          GAME_HEIGHT - height,
          y
        )
      );

    }

  }


  // ============================================================
  // DRAW
  // ============================================================

  function draw() {

    // Green background

    ctx.fillStyle =
      BACKGROUND_COLOR;

    ctx.fillRect(
      0,
      0,
      GAME_WIDTH,
      GAME_HEIGHT
    );


    // Select correct sprite

    let image;

    if (moving) {

      image =
        walkImages[lastDirection][walkFrame];

    }

    else {

      image =
        standImages[lastDirection];

    }


    // Draw character

    if (
      image &&
      image.complete &&
      image.naturalWidth > 0
    ) {

      ctx.drawImage(
        image,
        Math.round(x),
        Math.round(y)
      );

    }

  }


  // ============================================================
  // GAME LOOP
  // ============================================================

  let previousTime =
    performance.now();


  function gameLoop(currentTime) {

    let deltaMilliseconds =
      currentTime - previousTime;

    previousTime =
      currentTime;


    // Prevent giant jumps after switching tabs.

    deltaMilliseconds =
      Math.min(
        deltaMilliseconds,
        50
      );


    const deltaTime =
      deltaMilliseconds / 1000;


    update(
      deltaTime,
      deltaMilliseconds
    );

    draw();


    requestAnimationFrame(gameLoop);

  }


  // ============================================================
  // START
  // ============================================================

  requestAnimationFrame(gameLoop);

</script>

</body>
</html>
